openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /gif-library:
    get:
      operationId: getGifLibrary
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Shared Afilli GIF collection for signed-in accounts, content: { application/json: { schema: { $ref: "#/components/schemas/GifLibraryPage" } } } }
  /admin/gif-uploads:
    post:
      operationId: requestLibraryGifUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryGifInput" } } }
      responses:
        "200": { description: Owner-bound idempotent source upload for superadmin only, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryGifUpload" } } } }
  /admin/gif-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeLibraryGifUpload
      responses:
        "200": { description: Validated immutable animated GIF, content: { application/json: { schema: { $ref: "#/components/schemas/MessageGif" } } } }
  /gif-library/{id}/media:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getLibraryGifMedia
      responses:
        "200": { description: Ready GIF bytes for authenticated users; never a mutable source upload, content: { image/gif: { schema: { type: string, format: binary } } } }
  /discovery/books:
    get:
      operationId: getDiscoveryBooks
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [new, read, popular], default: new } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Visible released book cards in stable ranked pages, content: { application/json: { schema: { $ref: "#/components/schemas/DiscoveryBookPage" } } } }
  /discovery/book-cards:
    get:
      operationId: getBookCards
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string, maxLength: 1200 } }
      responses:
        "200": { description: Up to thirty visible book cards for local library IDs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryBookCard" } } } } }
  /authored-books/{id}/reading-position:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getReadingPosition
      responses:
        "200": { description: Owner-bound last accessible chapter with safe fallback, content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPosition" } } } }
    put:
      operationId: setReadingPosition
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPositionInput" } } }
      responses:
        "200": { description: Saved own reading chapter, content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPosition" } } } }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200": { description: Authorized administration overview, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
  /admin/accounts:
    get:
      operationId: getAdminAccounts
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Accounts for upper administrator only, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountPage" } } } }
  /admin/accounts/{id}:
    delete:
      operationId: deleteAdminAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletionInput" } } }
      responses:
        "204": { description: "Account and dependent content permanently deleted, media queued for removal" }
    patch:
      operationId: updateAdminAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountUpdate" } } }
      responses:
        "200": { description: Updated account with audit event, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccount" } } } }
  /admin/accounts/{id}/deletion:
    get:
      operationId: getAdminAccountDeletion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Permanent deletion scope, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletion" } } } }
  /admin/content:
    get:
      operationId: getAdminContent
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: "#/components/schemas/AdminContentKind" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Moderation records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminContentPage" } } } }
  /admin/content/{kind}/{id}:
    patch:
      operationId: updateAdminContent
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/AdminContentKind" } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminModerationUpdate" } } }
      responses:
        "200": { description: Reversible visibility update, content: { application/json: { schema: { $ref: "#/components/schemas/AdminContent" } } } }
  /admin/history:
    get:
      operationId: getAdminHistory
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Administration audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AdminHistoryPage" } } } }
  /admin/settings:
    put:
      operationId: updateAdminSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OfficialInstagramInput" } } }
      responses:
        "200": { description: Updated live application settings and audit record, content: { application/json: { schema: { $ref: "#/components/schemas/SocialSettings" } } } }
  /auth/session:
    get:
      operationId: getAccountSession
      responses:
        "200": { description: Current account or guest, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } } }
  /auth/account/deletion:
    get:
      operationId: getMyAccountDeletion
      responses:
        "200": { description: Own account deletion scope, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletion" } } } }
  /auth/account:
    delete:
      operationId: deleteMyAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountDeletionInput" } } }
      responses:
        "204": { description: Own account deleted after password and nickname confirmation; all sessions invalidated }
  /auth/account/deletion-status:
    post:
      operationId: getAccountDeletionStatus
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountDeletionReceiptInput" } } }
      responses:
        "200": { description: Deletion receipt lookup by unguessable request capability, content: { application/json: { schema: { $ref: "#/components/schemas/AccountDeletionReceipt" } } } }
  /auth/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountRegistration" } } }
      responses:
        "201": { description: Registered account, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } } }
  /auth/login:
    post:
      operationId: loginAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountLogin" } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } } }
  /auth/logout:
    post:
      operationId: logoutAccount
      responses:
        "204": { description: Session revoked }
  /auth/password-code:
    post:
      operationId: requestPasswordCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordCodeInput" } } }
      responses:
        "202":
          description: Password recovery accepted
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, message]
                properties:
                  challengeId: { type: string, format: uuid }
                  message: { type: string }
  /auth/reset-password:
    post:
      operationId: resetAccountPassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetInput" } } }
      responses:
        "200": { description: Password reset and account verified, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /social-settings:
    get:
      operationId: getSocialSettings
      responses:
        "200": { description: Public configuration, content: { application/json: { schema: { $ref: "#/components/schemas/SocialSettings" } } } }
    put:
      operationId: updateSocialSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OfficialInstagramInput" } } }
      responses:
        "200": { description: Administrator configuration, content: { application/json: { schema: { $ref: "#/components/schemas/SocialSettings" } } } }
  /my-profile:
    get:
      operationId: getMyProfile
      responses:
        "200": { description: Own profile, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderProfile" } } } }
    patch:
      operationId: updateMyProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileEditInput" } } }
      responses:
        "200": { description: Saved profile, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderProfile" } } } }
  /my-profile/visibility:
    patch:
      operationId: updateMyVisibility
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VisibilityInput" } } }
      responses:
        "200": { description: Administrator own visibility preference saved, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderProfile" } } } }
  /profiles:
    get:
      operationId: getPeople
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: People, content: { application/json: { schema: { $ref: "#/components/schemas/PeoplePage" } } } }
  /profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getReaderProfile
      responses:
        "200": { description: Public profile, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderProfile" } } } }
  /profiles/{id}/follow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setProfileFollow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FollowInput" } } }
      responses:
        "200": { description: Updated relation, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderProfile" } } } }
  /profiles/{id}/connections:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProfileConnections
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [followers, following] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Real connections, content: { application/json: { schema: { $ref: "#/components/schemas/PeoplePage" } } } }
  /profiles/{id}/content:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProfileContent
      parameters:
        - { name: tab, in: query, required: true, schema: { type: string, enum: [books, bulletins, liked] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Paginated real content, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileContent" } } } }
  /presence:
    post:
      operationId: updatePresence
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PresenceInput" } } }
      responses: { "204": { description: Foreground presence recorded } }
  /profile-uploads:
    post:
      operationId: requestProfileUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileUploadInput" } } }
      responses:
        "200": { description: Direct upload, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileUpload" } } } }
  /profile-media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProfileMedia
      responses:
        "200": { description: Attached profile image, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /conversations:
    get:
      operationId: getConversations
      responses:
        "200": { description: Own conversations only, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } } }
    post:
      operationId: startConversation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartConversationInput" } } }
      responses:
        "200": { description: Conversation, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
  /conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getConversation
      responses:
        "200": { description: Own conversation, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
  /conversations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getConversationMessages
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Latest first, content: { application/json: { schema: { $ref: "#/components/schemas/MessagePage" } } } }
    post:
      operationId: sendConversationMessage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MessageInput" } } }
      responses:
        "201": { description: Sent once, content: { application/json: { schema: { $ref: "#/components/schemas/DirectMessage" } } } }
  /conversations/{id}/sync:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: syncConversationMessages
      parameters:
        - { name: after, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,19}$' } }
      responses:
        "200": { description: "Ascending, owner-authorized recovery after a stable message sequence", content: { application/json: { schema: { $ref: "#/components/schemas/MessageSyncPage" } } } }
  /conversations/{id}/changes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getConversationChanges
      parameters:
        - { name: after, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,19}$' } }
      responses:
        "200": { description: "Durable deletions, expiry and read updates", content: { application/json: { schema: { $ref: "#/components/schemas/MessageSyncPage" } } } }
  /conversations/{id}/messages/{messageId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteConversationMessage
      responses:
        "200": { description: Sender-authorized tombstone visible to both participants, content: { application/json: { schema: { $ref: "#/components/schemas/DirectMessage" } } } }
  /conversations/{id}/photo-uploads:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: requestDirectPhotoUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DirectPhotoInput" } } }
      responses:
        "200": { description: Private direct-to-storage upload, content: { application/json: { schema: { $ref: "#/components/schemas/DirectPhotoUpload" } } } }
  /direct-photo-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeDirectPhotoUpload
      responses:
        "200": { description: Validated and metadata-stripped image, content: { application/json: { schema: { $ref: "#/components/schemas/MessagePhoto" } } } }
  /direct-media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getDirectPhoto
      responses:
        "200": { description: Authenticated non-expired conversation image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
  /message-media/cleanup:
    post:
      operationId: cleanupDirectMedia
      responses:
        "200": { description: Expired media hidden and bounded physical cleanup attempted, content: { application/json: { schema: { $ref: "#/components/schemas/MediaCleanupResult" } } } }
  /message-events:
    get:
      operationId: getMessageEvents
      description: Authenticated account-specific SSE invalidation hints. No tokens in URL and no message bodies in events. Reconnect always recovers from persisted messages.
      responses:
        "200": { description: Foreground private-message event stream, content: { text/event-stream: { schema: { type: string } } } }
  /conversations/{id}/read:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: readConversation
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/MessageReadInput" } } }
      responses: { "204": { description: Read by recipient } }
  /conversations/{id}/typing:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setConversationTyping
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TypingInput" } } }
      responses: { "204": { description: Participant typing recorded } }
  /social-notifications:
    get:
      operationId: getSocialNotifications
      responses:
        "200": { description: Own social notifications, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SocialNotification" } } } } }
  /social-notifications/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: readSocialNotification
      responses: { "204": { description: Read by owner } }
  /community-profile:
    post:
      operationId: saveCommunityProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityProfileInput" }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/CommunityPerson" } } } }
  /bulletins:
    get:
      operationId: getBulletins
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Feed, content: { application/json: { schema: { $ref: "#/components/schemas/BulletinFeed" } } } }
    post:
      operationId: createBulletin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulletinInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Bulletin" } } } }
  /bulletins/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getBulletin
      responses:
        "200": { description: Bulletin, content: { application/json: { schema: { $ref: "#/components/schemas/Bulletin" } } } }
    patch:
      operationId: updateBulletin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulletinInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Bulletin" } } } }
    delete:
      operationId: deleteBulletin
      responses: { "204": { description: Deleted } }
  /bulletins/{id}/like:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setBulletinLike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulletinLikeInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Bulletin" } } } }
  /bulletins/{id}/likes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getBulletinLikes
      responses:
        "200": { description: People, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CommunityPerson" } } } } }
  /bulletins/{id}/comments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getBulletinComments
      responses:
        "200": { description: Comments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BulletinComment" } } } } }
    post:
      operationId: createBulletinComment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulletinCommentInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BulletinComment" } } } }
  /bulletin-comments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateBulletinComment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulletinCommentInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/BulletinComment" } } } }
    delete:
      operationId: deleteBulletinComment
      responses: { "204": { description: Deleted } }
  /bulletin-reactions:
    get:
      operationId: getBulletinReactionPeople
      parameters:
        - { name: targetId, in: query, required: true, schema: { type: string } }
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [post, comment] } }
      responses:
        "200": { description: People, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BulletinReactionPerson" } } } } }
    put:
      operationId: setBulletinReaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulletinReactionInput" }
      responses:
        "200": { description: Reactions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BulletinReaction" } } } } }
  /authored-books:
    get:
      operationId: getAuthoredBooks
      responses:
        "200": { description: Own books only, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuthoredBook" } } } } }
    post:
      operationId: saveAuthoredBook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthoredBookInput" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/AuthoredBook" } } } }
  /authored-books/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAuthoredBook
      responses:
        "200": { description: Book, content: { application/json: { schema: { $ref: "#/components/schemas/AuthoredBook" } } } }
  /bulletin-notifications:
    get:
      operationId: getBulletinNotifications
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BulletinNotification" } } } } }
  /bulletin-notifications/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: readBulletinNotification
      responses: { "204": { description: Read } }
  /bulletin-uploads:
    post:
      operationId: requestBulletinUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulletinUploadInput" }
      responses:
        "200":
          description: Direct upload
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadURL]
                properties: { id: { type: string }, uploadURL: { type: string } }
  /bulletin-media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getBulletinMedia
      responses:
        "200": { description: Public attached image, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /writer-books:
    get:
      operationId: getWriterLibrary
      responses:
        "200": { description: Owner's writing library, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WriterSummary" } } } } }
  /writer-books/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getWriterBook
      responses:
        "200": { description: Private author document, content: { application/json: { schema: { $ref: "#/components/schemas/WriterBook" } } } }
    put:
      operationId: saveWriterBook
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterSaveInput" } } }
      responses:
        "200": { description: Saved with revision, content: { application/json: { schema: { $ref: "#/components/schemas/WriterBook" } } } }
        "409": { description: Conflicting device revision; fetch current document before resolving }
    delete:
      operationId: deleteWriterBook
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterRevisionInput" } } }
      responses:
        "204": { description: Deleted with author confirmation }
    patch:
      operationId: patchWriterBook
      description: Chapter delta against an exact revision. Retry the identical saveId and payload after an uncertain response. Does not publish.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterDeltaInput" } } }
      responses:
        "200": { description: Compact durable acknowledgement without manuscript text, content: { application/json: { schema: { $ref: "#/components/schemas/WriterSaveAck" } } } }
        "409": { description: Revision conflict or saveId reused with different content }
        "410": { description: Book was deleted and cannot be recreated }
  /writer-books/{id}/publication:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: changeWriterPublication
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterPublicationInput" } } }
      responses:
        "200": { description: Author-controlled publication, content: { application/json: { schema: { $ref: "#/components/schemas/WriterBook" } } } }
  /published-books:
    get:
      operationId: getPublishedBooks
      responses:
        "200": { description: Real published books, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuthoredBook" } } } } }
  /writer-presets:
    get:
      operationId: getWriterPresets
      responses:
        "200": { description: Available original cover artwork, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WriterPreset" } } } } }
  /writer-uploads:
    post:
      operationId: requestWriterUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulletinUploadInput" } } }
      responses:
        "200": { description: Private direct upload, content: { application/json: { schema: { $ref: "#/components/schemas/WriterUpload" } } } }
  /writer-uploads/{id}/reservations/{reservationId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: reserveWriterUpload
      description: Owner-only indefinite offline protection. The upload ID is its initial reservation. Other devices use their own durable UUIDs.
      responses:
        "204": { description: Protected until explicitly released }
    delete:
      operationId: releaseWriterUpload
      description: Owner-only explicit abandonment of this reservation, never an automatic consequence of syncing or going offline. Other reservations and book references remain protected.
      responses:
        "204": { description: Reservation released idempotently }
  /writer-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeWriterUpload
      responses:
        "200": { description: Validated immutable image, content: { application/json: { schema: { $ref: "#/components/schemas/WriterImage" } } } }
  /writer-media/{id}/access:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getWriterImageAccess
      responses:
        "200": { description: Short-lived private display access, content: { application/json: { schema: { $ref: "#/components/schemas/WriterImage" } } } }
  /writer-spelling:
    post:
      operationId: checkWriterSpelling
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterSpellingInput" } } }
      responses:
        "200": { description: Turkish dictionary suggestions processed on Afilli's server, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WriterSpellingIssue" } } } } }
  /writer-voice:
    get:
      operationId: getWriterVoiceStatus
      responses:
        "200": { description: Voice service availability, content: { application/json: { schema: { $ref: "#/components/schemas/WriterVoiceStatus" } } } }
    post:
      operationId: transcribeWriterVoice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterVoiceInput" } } }
      responses:
        "200": { description: Actual transcription, content: { application/json: { schema: { $ref: "#/components/schemas/WriterSpellingInput" } } } }
  /authored-books/{id}/like:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setAuthoredBookLike
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterLikeInput" } } }
      responses:
        "200": { description: Real book reaction, content: { application/json: { schema: { $ref: "#/components/schemas/AuthoredBook" } } } }
  /book-notifications:
    get:
      operationId: getBookNotifications
      parameters: [{ name: cursor, in: query, schema: { type: string } }]
      responses:
        "200": { description: "Only saved-book chapters, authored-book comments and comment replies", content: { application/json: { schema: { $ref: "#/components/schemas/BookNotificationPage" } } } }
  /book-notifications/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: readBookNotification
      responses:
        "204": { description: Read by recipient }
  /book-subscriptions:
    post:
      operationId: subscribeSavedBooks
      description: Additive migration of this account's existing local bookmarks; unavailable books are skipped, never removed locally.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SavedBookSubscriptionsInput" } } }
      responses:
        "204": { description: Subscribed to available books }
  /authored-books/{id}/saved:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setBookSubscription
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BookSubscriptionInput" } } }
      responses:
        "204": { description: Saved-book notification subscription updated idempotently }
  /authored-books/{id}/comment-threads:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getBookCommentThreads
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: chapterId, in: query, schema: { type: string, format: uuid } }
        - { name: paragraphId, in: query, schema: { type: string, format: uuid } }
        - { name: scope, in: query, schema: { type: string, enum: [book, chapter, paragraph] } }
      responses:
        "200": { description: Paginated top-level comments including safe deleted-parent placeholders, content: { application/json: { schema: { $ref: "#/components/schemas/WriterCommentPage" } } } }
  /writer-comments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: editWriterComment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterCommentEditInput" } } }
      responses:
        "200": { description: Comment edited by its author without moving its thread, content: { application/json: { schema: { $ref: "#/components/schemas/WriterComment" } } } }
        "403": { description: Only the comment author may edit it }
        "404": { description: Comment is not accessible }
    delete:
      operationId: deleteWriterComment
      responses:
        "200": { description: Author content removed; anonymous thread structure and replies preserved, content: { application/json: { schema: { $ref: "#/components/schemas/WriterComment" } } } }
        "403": { description: Only the comment author may delete it }
        "404": { description: Comment is not accessible }
  /writer-comments/{id}/path:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getWriterCommentPath
      responses:
        "200": { description: Visible ancestors and targeted comment in root-to-comment order, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WriterComment" } } } } }
  /writer-comments/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getWriterCommentReplies
      parameters: [{ name: cursor, in: query, schema: { type: string } }]
      responses:
        "200": { description: Paginated direct replies; reply to any visible level, content: { application/json: { schema: { $ref: "#/components/schemas/WriterCommentPage" } } } }
  /writer-comments/{id}/reaction:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setWriterCommentReaction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CommentReactionInput" } } }
      responses:
        "200": { description: Authoritative comment reaction counts, content: { application/json: { schema: { $ref: "#/components/schemas/WriterComment" } } } }
  /authored-books/{id}/chapters/{chapterId}/interactions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getReaderChapter
      responses:
        "200": { description: Released chapter interactions and stable paragraph references, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderChapter" } } } }
    put:
      operationId: setReaderLike
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReaderLikeInput" } } }
      responses:
        "200": { description: Authoritative chapter and paragraph counts after an idempotent like or unlike, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderChapter" } } } }
  /writer-comments/{id}/reports:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: reportWriterComment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReaderReportInput" } } }
      responses:
        "200": { description: Own report recorded once for this comment, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderReport" } } } }
        "429": { description: Too many reports }
  /admin/reader-reports:
    get:
      operationId: getReaderReports
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, dismissed, hidden] } }
      responses:
        "200": { description: Authorized administrator report inbox, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderReportPage" } } } }
  /admin/reader-reports/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: resolveReaderReport
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReaderReportDecision" } } }
      responses:
        "200": { description: Report reviewed without deleting the discussion, content: { application/json: { schema: { $ref: "#/components/schemas/ReaderReport" } } } }
  /authored-books/{id}/comments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAuthoredBookComments
      responses:
        "200": { description: Latest real comments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WriterComment" } } } } }
    post:
      operationId: addAuthoredBookComment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriterCommentInput" } } }
      responses:
        "200": { description: Added idempotently, content: { application/json: { schema: { $ref: "#/components/schemas/WriterComment" } } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    DiscoveryBookCard:
      type: object
      required: [id, title, author, genres, readCount, likeCount, commentCount, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { $ref: "#/components/schemas/CommunityPerson" }
        coverUrl: { type: [string, "null"] }
        genres: { type: array, items: { type: string } }
        readCount: { type: integer }
        likeCount: { type: integer }
        commentCount: { type: integer }
        publishedAt: { type: string, format: date-time }
    DiscoveryBookPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DiscoveryBookCard" } }
        nextCursor: { type: [string, "null"] }
    ReadingPositionInput:
      type: object
      required: [chapterId]
      properties:
        chapterId: { type: string, format: uuid }
    ReadingPosition:
      type: object
      required: [chapterId, resumed, chapterMissing]
      properties:
        chapterId: { type: [string, "null"] }
        resumed: { type: boolean }
        chapterMissing: { type: boolean }
    SocialSettings:
      type: object
      required: [instagramUrl, popularDays, popularLimit]
      properties:
        instagramUrl: { type: string, nullable: true, maxLength: 120 }
        popularDays: { type: integer, minimum: 1, maximum: 365 }
        popularLimit: { type: integer, minimum: 1, maximum: 100 }
    OfficialInstagramInput:
      type: object
      required: [instagramUrl]
      properties:
        instagramUrl: { type: string, nullable: true, maxLength: 120 }
    ReaderProfile:
      type: object
      required: [id, nickname, handle, avatar, cover, bio, quote, bookCount, followersCount, followingCount, following, isMe, isAdmin, online, lastSeen, typing, popular, premium]
      properties:
        id: { type: string }
        nickname: { type: string }
        handle: { type: string }
        avatar: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        bio: { type: string }
        quote: { type: string }
        bookCount: { type: integer }
        followersCount: { type: integer }
        followingCount: { type: integer }
        following: { type: boolean }
        isMe: { type: boolean }
        isAdmin: { type: boolean }
        online: { type: boolean }
        onlineVisible: { type: boolean, nullable: true, description: Own administrator visibility preference; null for other viewers and regular accounts }
        lastSeen: { type: string, nullable: true }
        typing: { type: boolean }
        popular: { type: boolean }
        premium: { type: boolean }
    ProfileEditInput:
      type: object
      required: [nickname, handle, bio, quote]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        handle: { type: string, minLength: 3, maxLength: 30 }
        bio: { type: string, maxLength: 500 }
        quote: { type: string, maxLength: 200 }
        avatarUploadId: { type: string, nullable: true }
        coverUploadId: { type: string, nullable: true }
    PeoplePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CommunityPerson" } }
        nextCursor: { type: string, nullable: true }
    ProfileBook:
      type: object
      required: [id, title, author, cover, genre, year, readCount, isPublic]
      properties:
        id: { type: string }
        title: { type: string }
        author: { $ref: "#/components/schemas/CommunityPerson" }
        cover: { type: string, nullable: true }
        genre: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        readCount: { type: integer }
        isPublic: { type: boolean }
    ProfileContent:
      type: object
      required: [books, bulletins, nextCursor]
      properties:
        books: { type: array, items: { $ref: "#/components/schemas/ProfileBook" } }
        bulletins: { type: array, items: { $ref: "#/components/schemas/Bulletin" } }
        nextCursor: { type: string, nullable: true }
    ProfileUploadInput:
      type: object
      required: [purpose, contentType, size]
      properties:
        purpose: { type: string, enum: [avatar, cover] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    ProfileUpload:
      type: object
      required: [id, uploadURL]
      properties: { id: { type: string }, uploadURL: { type: string } }
    FollowInput:
      type: object
      required: [following]
      properties: { following: { type: boolean } }
    PresenceInput:
      type: object
      required: [active]
      properties: { active: { type: boolean } }
    VisibilityInput:
      type: object
      required: [visible]
      properties: { visible: { type: boolean } }
    AccountDeletionInput:
      type: object
      required: [password, confirmation, requestId]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
        confirmation: { type: string, minLength: 1, maxLength: 40 }
        requestId: { type: string, format: uuid }
    AccountDeletionReceiptInput:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
    AccountDeletionReceipt:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    TypingInput:
      type: object
      required: [typing]
      properties: { typing: { type: boolean } }
    StartConversationInput:
      type: object
      required: [peerId]
      properties: { peerId: { type: string } }
    MessageInput:
      type: object
      required: [clientId, body]
      properties:
        clientId: { type: string, format: uuid }
        body: { type: string, maxLength: 4000 }
        replyToId: { type: string, format: uuid, nullable: true }
        gif: { anyOf: [{ $ref: "#/components/schemas/MessageGif" }, { type: "null" }] }
        photoId: { type: string, format: uuid, nullable: true }
    DirectPhotoInput:
      type: object
      required: [clientId, size]
      properties:
        clientId: { type: string, format: uuid }
        size: { type: integer, minimum: 1, maximum: 2097152 }
    DirectPhotoUpload:
      type: object
      required: [id, uploadUrl, ready]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string, nullable: true }
        ready: { type: boolean }
    MessagePhoto:
      type: object
      required: [id, width, height]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
    MediaCleanupResult:
      type: object
      required: [hasMore, retryNeeded]
      properties:
        hasMore: { type: boolean }
        retryNeeded: { type: boolean }
    MessageGif:
      type: object
      required: [provider, id, title, url, width, height, sourceUrl, attribution, license]
      properties:
        provider: { type: string, enum: [klipy, afilli] }
        id: { type: string, minLength: 1, maxLength: 250 }
        title: { type: string, maxLength: 250 }
        url: { type: string, format: uri, maxLength: 2048 }
        width: { type: integer, minimum: 1, maximum: 4000 }
        height: { type: integer, minimum: 1, maximum: 4000 }
        sourceUrl: { type: string, format: uri, maxLength: 2048 }
        attribution: { type: string, maxLength: 500 }
        license: { type: string, maxLength: 100, nullable: true }
    LibraryGifInput:
      type: object
      required: [clientId, title, size]
      properties:
        clientId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    LibraryGifUpload:
      type: object
      required: [id, ready, uploadUrl]
      properties:
        id: { type: string, format: uuid }
        ready: { type: boolean }
        uploadUrl: { type: [string, "null"] }
    GifLibraryPage:
      type: object
      required: [items, nextOffset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MessageGif" } }
        nextOffset: { type: [integer, "null"] }
    MessageQuote:
      type: object
      required: [id, available, sender, body, gif]
      properties:
        id: { type: string, nullable: true }
        available: { type: boolean }
        sender: { anyOf: [{ $ref: "#/components/schemas/CommunityPerson" }, { type: "null" }] }
        body: { type: string, nullable: true }
        gif: { anyOf: [{ $ref: "#/components/schemas/MessageGif" }, { type: "null" }] }
        photo: { anyOf: [{ $ref: "#/components/schemas/MessagePhoto" }, { type: "null" }] }
        mediaExpired: { type: boolean }
    MessageReadInput:
      type: object
      properties:
        throughSequence: { type: string, pattern: '^[0-9]{1,19}$' }
    Conversation:
      type: object
      required: [id, peer, lastMessage, updatedAt, unreadCount, peerTyping, peerOnline, peerLastSeen]
      properties:
        id: { type: string }
        peer: { $ref: "#/components/schemas/CommunityPerson" }
        lastMessage: { type: string, nullable: true }
        updatedAt: { type: string }
        unreadCount: { type: integer }
        peerTyping: { type: boolean }
        peerOnline: { type: boolean }
        peerLastSeen: { type: string, nullable: true }
    DirectMessage:
      type: object
      required: [id, threadId, sender, body, createdAt, readAt, clientId, sequence, reply, gif]
      properties:
        id: { type: string }
        threadId: { type: string }
        sender: { $ref: "#/components/schemas/CommunityPerson" }
        body: { type: string }
        createdAt: { type: string }
        readAt: { type: string, nullable: true }
        clientId: { type: string, format: uuid }
        sequence: { type: string }
        reply: { anyOf: [{ $ref: "#/components/schemas/MessageQuote" }, { type: "null" }] }
        gif: { anyOf: [{ $ref: "#/components/schemas/MessageGif" }, { type: "null" }] }
        photo: { anyOf: [{ $ref: "#/components/schemas/MessagePhoto" }, { type: "null" }] }
        changeSequence: { type: string }
        deletedAt: { type: string, nullable: true }
        mediaExpiresAt: { type: string, nullable: true }
        mediaExpired: { type: boolean }
    MessageSyncPage:
      type: object
      required: [items, nextAfter, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DirectMessage" } }
        nextAfter: { type: string }
        hasMore: { type: boolean }
    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DirectMessage" } }
        nextCursor: { type: string, nullable: true }
        changeCursor: { type: string }
    SocialNotification:
      type: object
      required: [id, body, read, createdAt, actorId, threadId, bookId, kind, commentId, chapterId]
      properties:
        kind: { type: string, enum: [chapter, book_comment, comment_reply] }
        commentId: { type: string, nullable: true }
        chapterId: { type: string, nullable: true }
        id: { type: string }
        body: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
        actorId: { type: string }
        threadId: { type: string, nullable: true }
        bookId: { type: string, nullable: true }
    CommunityProfileInput:
      type: object
      required: [nickname]
      properties: { nickname: { type: string, minLength: 1, maxLength: 40 } }
    BulletinLikeInput:
      type: object
      required: [liked]
      properties: { liked: { type: boolean } }
    BulletinReactionInput:
      type: object
      required: [targetId, targetType, emoji]
      properties:
        targetId: { type: string }
        targetType: { type: string, enum: [post, comment] }
        emoji: { type: string, nullable: true }
    AuthoredBookInput:
      type: object
      required: [localId, title, body]
      properties:
        localId: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 200000 }
    BulletinUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    CommunityPerson:
      type: object
      required: [id, nickname, avatar]
