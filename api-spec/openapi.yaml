openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /visual-collections:
    get:
      operationId: getVisualCollections
      responses:
        "200": { description: Published monthly Premium artwork, content: { application/json: { schema: { $ref: "#/components/schemas/VisualCollection" } } } }
  /visual-collections/me:
    get:
      operationId: getMyVisualCollection
      responses:
        "200": { description: Own saved artwork and preferences, content: { application/json: { schema: { $ref: "#/components/schemas/VisualCollectionAccount" } } } }
  /visual-collections/{id}/save:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: saveVisualCollectionItem
      responses:
        "200": { description: Idempotently added to own collection, content: { application/json: { schema: { $ref: "#/components/schemas/VisualCollectionAccount" } } } }
  /visual-collections/selection:
    put:
      operationId: setVisualCollectionSelection
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VisualSelectionInput" } } }
      responses:
        "200": { description: Saved owner-authorized selection or disabled it without deleting saved items, content: { application/json: { schema: { $ref: "#/components/schemas/VisualCollectionAccount" } } } }
  /visual-collections/active:
    get:
      operationId: getActiveVisualCollection
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string, maxLength: 100 } }
        - { name: targetId, in: query, schema: { type: string, maxLength: 100, default: profile } }
      responses:
        "200": { description: Publicly visible artwork only while owner's Premium is active, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VisualSelection" } } } } }
  /admin/visual-collections:
    get:
      operationId: getAdminVisualCollections
      responses:
        "200": { description: Artwork publishing and saved counts, content: { application/json: { schema: { $ref: "#/components/schemas/VisualCollection" } } } }
    post:
      operationId: requestVisualAssetUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VisualAssetUploadInput" } } }
      responses:
        "201": { description: Administrator-bound staged upload, content: { application/json: { schema: { $ref: "#/components/schemas/VisualAssetUpload" } } } }
  /admin/visual-collections/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeVisualAssetUpload
      responses:
        "200": { description: Validated immutable artwork, content: { application/json: { schema: { $ref: "#/components/schemas/VisualAsset" } } } }
  /admin/visual-collections/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateVisualAsset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VisualAssetUpdate" } } }
      responses:
        "200": { description: Audited artwork publication update, content: { application/json: { schema: { $ref: "#/components/schemas/VisualAsset" } } } }
  /gif-library:
    get:
      operationId: getGifLibrary
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Shared Afilli GIF collection for signed-in accounts, content: { application/json: { schema: { $ref: "#/components/schemas/GifLibraryPage" } } } }
  /admin/gif-uploads:
    post:
      operationId: requestLibraryGifUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryGifInput" } } }
      responses:
        "200": { description: Owner-bound idempotent source upload for superadmin only, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryGifUpload" } } } }
  /admin/gif-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeLibraryGifUpload
      responses:
        "200": { description: Validated immutable animated GIF, content: { application/json: { schema: { $ref: "#/components/schemas/MessageGif" } } } }
  /premium/config:
    get:
      operationId: getPremiumConfig
      responses:
        "200": { description: Current RevenueCat offering and public mobile SDK keys; empty when not configured, content: { application/json: { schema: { $ref: "#/components/schemas/PremiumConfig" } } } }
  /account-appeals/config:
    get:
      operationId: getAccountAppealConfig
      responses:
        "200": { description: Dedicated one-time RevenueCat appeal product configuration; empty until configured, content: { application/json: { schema: { $ref: "#/components/schemas/AccountAppealConfig" } } } }
  /account-appeals/me:
    get:
      operationId: getMyAccountAppeal
      responses:
        "200": { description: Own disabled-account appeal state and latest payment review, content: { application/json: { schema: { $ref: "#/components/schemas/AccountAppealSelf" } } } }
  /prohibited-image-contact/me:
    get:
      operationId: getProhibitedImageContactMe
      responses:
        "200": { description: Current restricted image-moderation case and the user's messages, content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageContactSelf" } } } }
  /prohibited-image-contact/messages:
    post:
      operationId: sendProhibitedImageContactMessage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageContactMessageInput" } } }
      responses:
        "201": { description: Message sent to the moderation review inbox, content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageContactMessageCreated" } } } }
  /account-appeals/verify:
    post:
      operationId: verifyAccountAppealPurchase
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountAppealVerificationInput" } } }
      responses:
        "201": { description: Appeal created only after server-side RevenueCat transaction verification, content: { application/json: { schema: { $ref: "#/components/schemas/AccountAppeal" } } } }
        "200": { description: Idempotent replay of the same verified transaction, content: { application/json: { schema: { $ref: "#/components/schemas/AccountAppeal" } } } }
  /premium/me:
    get:
      operationId: getMyPremium
      responses:
        "200": { description: "Current user's application, membership, and appearance settings", content: { application/json: { schema: { $ref: "#/components/schemas/PremiumAccount" } } } }
  /premium/applications:
    post:
      operationId: createPremiumApplication
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PremiumApplicationInput" } } }
      responses:
        "201": { description: Submitted one pending membership application, content: { application/json: { schema: { $ref: "#/components/schemas/PremiumApplication" } } } }
  /premium/applications/{id}/verify:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: verifyPremiumPurchase
      responses:
        "200": { description: Premium activated only after the server confirms an active matching RevenueCat entitlement, content: { application/json: { schema: { $ref: "#/components/schemas/PremiumAccount" } } } }
  /premium/restore:
    post:
      operationId: restorePremiumPurchase
      responses:
        "200": { description: Restored only after the server confirms an active matching RevenueCat entitlement, content: { application/json: { schema: { $ref: "#/components/schemas/PremiumAccount" } } } }
        "409": { description: No active paid entitlement could be verified }
  /premium/preferences:
    put:
      operationId: updatePremiumPreferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PremiumPreferencesInput" } } }
      responses:
        "200": { description: Saved premium-only appearance preferences, content: { application/json: { schema: { $ref: "#/components/schemas/PremiumPreferences" } } } }
  /store/catalog:
    get:
      operationId: getStoreCatalog
      responses:
        "200": { description: Current store products and whether order requests are open, content: { application/json: { schema: { $ref: "#/components/schemas/StoreCatalog" } } } }
  /store/cart:
    get:
      operationId: getMyStoreCart
      responses:
        "200": { description: The signed-in user's saved cart, content: { application/json: { schema: { $ref: "#/components/schemas/StoreCart" } } } }
  /store/cart/items:
    post:
      operationId: addStoreCartItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoreCartAddInput" } } }
      responses:
        "200": { description: Added one item to the signed-in user's cart, content: { application/json: { schema: { $ref: "#/components/schemas/StoreCart" } } } }
  /store/cart/items/{productId}:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string, maxLength: 80 } }]
    patch:
      operationId: updateStoreCartItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoreCartUpdateInput" } } }
      responses:
        "200": { description: Updated quantity in the signed-in user's cart, content: { application/json: { schema: { $ref: "#/components/schemas/StoreCart" } } } }
    delete:
      operationId: removeStoreCartItem
      responses:
        "200": { description: Removed an item from the signed-in user's cart, content: { application/json: { schema: { $ref: "#/components/schemas/StoreCart" } } } }
  /store/orders:
    get:
      operationId: getMyStoreOrders
      responses:
        "200": { description: The signed-in user's order requests, content: { application/json: { schema: { $ref: "#/components/schemas/StoreOrderPage" } } } }
    post:
      operationId: createStoreOrder
      responses:
        "201": { description: Submitted the user's cart as an unpaid order request, content: { application/json: { schema: { $ref: "#/components/schemas/StoreOrder" } } } }
  /admin/store-orders:
    get:
      operationId: getAdminStoreOrders
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Order requests for administrators, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreOrderPage" } } } }
  /admin/store-orders/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: decideAdminStoreOrder
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreOrderDecisionInput" } } }
      responses:
        "200": { description: Recorded the administrator's order decision without taking payment, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreOrderDecisionResult" } } } }
  /admin/store-settings:
    get:
      operationId: getAdminStoreSettings
      responses:
        "200": { description: Current order-request availability, content: { application/json: { schema: { $ref: "#/components/schemas/StoreSettings" } } } }
    put:
      operationId: updateAdminStoreSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreSettingsInput" } } }
      responses:
        "200": { description: Updated whether the store accepts new order requests, content: { application/json: { schema: { $ref: "#/components/schemas/StoreSettings" } } } }
  /admin/store-products:
    get:
      operationId: getAdminStoreProducts
      responses:
        "200": { description: Products currently available in the store catalog, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StoreProduct" } } } } }
    post:
      operationId: createAdminStoreProduct
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreProductCreateInput" } } }
      responses:
        "201": { description: Added a catalog product after validating the administrator's completed image upload, content: { application/json: { schema: { $ref: "#/components/schemas/StoreProduct" } } } }
  /admin/store-product-uploads:
    post:
      operationId: requestAdminStoreProductUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreProductUploadInput" } } }
      responses:
        "200": { description: Short-lived direct upload target for a store product image, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreProductUpload" } } } }
  /admin/store-product-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeAdminStoreProductUpload
      responses:
        "200": { description: Validated and optimized product image, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreProductUploadComplete" } } } }
  /admin/book-promotion-settings:
    get:
      operationId: getAdminBookPromotionSettings
      responses:
        "200": { description: Free book promotion availability, content: { application/json: { schema: { $ref: "#/components/schemas/BookPromotionSettings" } } } }
    put:
      operationId: updateAdminBookPromotionSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminBookPromotionSettingsInput" } } }
      responses:
        "200": { description: Updated free request availability and supported durations, content: { application/json: { schema: { $ref: "#/components/schemas/BookPromotionSettings" } } } }
  /admin/book-promotion-requests:
    get:
      operationId: getAdminBookPromotionRequests
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [all, pending, active, rejected, expired], default: pending } }
      responses:
        "200": { description: Book promotion requests for administrators, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBookPromotionRequestPage" } } } }
  /admin/book-promotion-requests/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: decideAdminBookPromotionRequest
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminBookPromotionDecisionInput" } } }
      responses:
        "200": { description: Recorded free approval or rejection, content: { application/json: { schema: { $ref: "#/components/schemas/BookPromotionRequest" } } } }
  /store-product-media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getStoreProductMedia
      responses:
        "200": { description: Optimized public image of a listed store product, content: { image/jpeg: { schema: { type: string, format: binary } } } }
  /gif-library/{id}/media:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getLibraryGifMedia
      responses:
        "200": { description: Ready GIF bytes for authenticated users; never a mutable source upload, content: { image/gif: { schema: { type: string, format: binary } } } }
  /discovery/books:
    get:
      operationId: getDiscoveryBooks
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [new, read, popular], default: new } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [romantik, gerilim-polisiye-gizem, fantastik, mafya-yeralti, bilim-kurgu-distopya, dram-hayat-hikayeleri, ask-romani, fantastik-bilim-kurgu, polisiye-gerilim, mafya, psikolojik-iliskiler] } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Visible released book cards in stable ranked pages, content: { application/json: { schema: { $ref: "#/components/schemas/DiscoveryBookPage" } } } }
  /discovery/promoted-books:
    get:
      operationId: getPromotedBooks
      responses:
        "200": { description: Currently active and publicly visible promoted books, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryBookCard" } } } } }
  /reader/read-books:
    get:
      operationId: getReaderReadBooks
      responses:
        "200": { description: "Books previously read by the authenticated reader, ordered by latest reading activity", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryBookCard" } } } } }
  /discovery/book-cards:
    get:
      operationId: getBookCards
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string, maxLength: 1200 } }
      responses:
        "200": { description: Up to thirty visible book cards for local library IDs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiscoveryBookCard" } } } } }
  /authored-books/{id}/reading-position:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getReadingPosition
      responses:
        "200": { description: Owner-bound last accessible chapter with safe fallback, content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPosition" } } } }
    put:
      operationId: setReadingPosition
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPositionInput" } } }
      responses:
        "200": { description: Saved own reading chapter, content: { application/json: { schema: { $ref: "#/components/schemas/ReadingPosition" } } } }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200": { description: Authorized administration overview, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
  /admin/premium-applications:
    get:
      operationId: getAdminPremiumApplications
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Membership applications for administrators, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPremiumApplicationPage" } } } }
  /admin/premium-applications/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: decideAdminPremiumApplication
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPremiumDecisionInput" } } }
      responses:
        "200": { description: Audited paid/free approval or rejection, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPremiumApplication" } } } }
  /admin/account-appeals:
    get:
      operationId: getAdminAccountAppeals
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Verified paid account-appeal requests for upper administrators, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountAppealPage" } } } }
  /admin/account-appeals/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: decideAdminAccountAppeal
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountAppealDecisionInput" } } }
      responses:
        "200": { description: Audited account unblocking or rejection with user notification, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountAppeal" } } } }
  /admin/prohibited-images:
    get:
      operationId: getAdminProhibitedImages
      responses:
        "200": { description: Private reference images and the active minimum, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProhibitedImageCollection" } } } }
  /admin/prohibited-image-uploads:
    post:
      operationId: requestProhibitedImageUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageUploadInput" } } }
      responses:
        "200": { description: Short-lived private image upload for a superadmin, content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageUpload" } } } }
  /admin/prohibited-image-uploads/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: completeProhibitedImageUpload
      responses:
        "200": { description: Validated private reference image, content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageUploadStatus" } } } }
  /admin/prohibited-images/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: deleteAdminProhibitedImage
      responses:
        "204": { description: Reference image removed; active minimum is protected }
  /admin/prohibited-image-attempts:
    get:
      operationId: getAdminProhibitedImageAttempts
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200": { description: "Restricted users, private evidence and contact messages", content: { application/json: { schema: { $ref: "#/components/schemas/AdminProhibitedImageAttemptPage" } } } }
  /admin/prohibited-image-attempts/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: decideProhibitedImageAttempt
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageDecisionInput" } } }
      responses:
        "200": { description: Account restriction confirmed or released by a superadmin, content: { application/json: { schema: { $ref: "#/components/schemas/ProhibitedImageDecisionResult" } } } }
  /admin/accounts:
    get:
      operationId: getAdminAccounts
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Accounts for upper administrator only, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountPage" } } } }
  /admin/accounts/{id}:
    delete:
      operationId: deleteAdminAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletionInput" } } }
      responses:
        "204": { description: "Account and dependent content permanently deleted, media queued for removal" }
    patch:
      operationId: updateAdminAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountUpdate" } } }
      responses:
        "200": { description: Updated account with audit event, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccount" } } } }
  /admin/accounts/{id}/deletion:
    get:
      operationId: getAdminAccountDeletion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Permanent deletion scope, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletion" } } } }
  /admin/content:
    get:
      operationId: getAdminContent
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: "#/components/schemas/AdminContentKind" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Moderation records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminContentPage" } } } }
  /admin/content/{kind}/{id}:
    patch:
      operationId: updateAdminContent
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/AdminContentKind" } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminModerationUpdate" } } }
      responses:
        "200": { description: Reversible visibility update, content: { application/json: { schema: { $ref: "#/components/schemas/AdminContent" } } } }
  /admin/history:
    get:
      operationId: getAdminHistory
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Administration audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AdminHistoryPage" } } } }
  /admin/settings:
    put:
      operationId: updateAdminSettings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OfficialInstagramInput" } } }
      responses:
        "200": { description: Updated live application settings and audit record, content: { application/json: { schema: { $ref: "#/components/schemas/SocialSettings" } } } }
  /auth/session:
    get:
      operationId: getAccountSession
      responses:
        "200": { description: Current account or guest, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } } }
  /auth/account/deletion:
    get:
      operationId: getMyAccountDeletion
      responses:
        "200": { description: Own account deletion scope, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccountDeletion" } } } }
  /auth/account:
    delete:
      operationId: deleteMyAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountDeletionInput" } } }
      responses:
        "204": { description: Own account deleted after password and nickname confirmation; all sessions invalidated }
  /auth/account/deletion-status:
    post:
      operationId: getAccountDeletionStatus
      requestBody:
        required: true
